[project]
name = "yolo-ex"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "inference-sdk>=1.5.1",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "opencv-python==4.12.0.88",
    "python-dotenv>=1.2.3",
    "roboflow>=1.4.2",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "ultralytics>=8.4.123",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
